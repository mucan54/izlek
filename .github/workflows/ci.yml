name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  CARGO_TERM_COLOR: always
  # DataFusion with debug info does not fit on a hosted runner's disk.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  vectors:
    name: spec vectors
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 spec/vectors/gen.py --check

  go:
    name: go (ingest, control, canary)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: PostHog SDK compatibility
        run: |
          (cd ingest/compat && npm ci)
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
          go test -tags compat -count=1 ./ingest/compat/

  web:
    name: web sdk + ui
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright (the tests use the machine's copy)
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: sdk-web
        working-directory: sdk-web
        run: npm ci && npm test
      - name: ui
        working-directory: ui
        run: npm ci && npm test

  kmp:
    name: kmp sdk (jvm)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - working-directory: sdk-kmp
        run: ./gradlew jvmTest -Pizlek.android=false

  engine:
    name: engine (rust) + end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (engine/rust-toolchain.toml)
        working-directory: engine
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - working-directory: engine
        run: cargo fmt --all -- --check
      - working-directory: engine
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit, integration, isolation and differential tests
        working-directory: engine
        run: cargo test --workspace
      - working-directory: engine
        run: cargo build -p la-shipper -p la-query

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the web SDK and the UI
        run: |
          (cd sdk-web && npm ci && npm run build)
          (cd ui && npm ci && npm run build)
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: End-to-end (file:// store)
        run: node e2e/run.mjs
        env:
          LA_E2E_GRADLE_ARGS: "-Pizlek.android=false"
      - name: End-to-end (S3 protocol)
        run: node e2e/run.mjs --s3
        env:
          LA_E2E_GRADLE_ARGS: "-Pizlek.android=false"
