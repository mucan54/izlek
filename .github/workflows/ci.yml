name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false   # a newer push waits; a 30-minute run is not thrown away

permissions:
  contents: read

env:
  # A real S3 implementation for the store contract tests: unlike the in-repo dev server it
  # verifies SigV4 signatures and implements conditional writes itself.
  MINIO_IMAGE: minio/minio:RELEASE.2025-04-22T22-12-26Z
  MINIO_USER: izlek-ci
  MINIO_PASSWORD: izlek-ci-secret-key
  GOTOOLCHAIN: local
  CARGO_TERM_COLOR: always
  # DataFusion with debug info does not fit on a hosted runner's disk.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  vectors:
    name: spec vectors
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 spec/vectors/gen.py --check

  go:
    name: go (ingest, control, canary)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: PostHog SDK compatibility
        run: |
          (cd ingest/compat && npm ci)
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
          go test -tags compat -count=1 ./ingest/compat/

  web:
    name: web sdk + ui
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright (the tests use the machine's copy)
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: sdk-web
        working-directory: sdk-web
        run: npm ci && npm test
      - name: ui
        working-directory: ui
        run: npm ci && npm test

  s3:
    name: store contract on MinIO
    runs-on: ubuntu-24.04
    env:
      LA_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      LA_TEST_S3_BUCKET: la-test
      LA_TEST_S3_REGION: us-east-1
      LA_TEST_S3_ACCESS_KEY: izlek-ci
      LA_TEST_S3_SECRET_KEY: izlek-ci-secret-key
    steps:
      - uses: actions/checkout@v4
      - name: Start MinIO
        run: |
          docker pull -q "$MINIO_IMAGE" || { docker pull -q minio/minio:latest && docker tag minio/minio:latest "$MINIO_IMAGE"; }
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER="$MINIO_USER" -e MINIO_ROOT_PASSWORD="$MINIO_PASSWORD" "$MINIO_IMAGE" server /data
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:9000/minio/health/live && break; sleep 1; done
          AWS_ACCESS_KEY_ID="$MINIO_USER" AWS_SECRET_ACCESS_KEY="$MINIO_PASSWORD" AWS_DEFAULT_REGION=us-east-1 \
            aws --endpoint-url http://127.0.0.1:9000 s3 mb s3://la-test
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Go client (SigV4, conditional put, listing, streaming)
        run: go test -count=1 -v -run 'TestContract|TestPutIfAbsentRace' ./golib/objstore/
      - name: Rust toolchain
        working-directory: engine
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
          key: core
      - name: Rust client (conditional put race, manifest commits)
        working-directory: engine
        run: cargo test -p la-core --test s3_real -- --nocapture

  kmp:
    name: kmp sdk (jvm)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - working-directory: sdk-kmp
        run: ./gradlew jvmTest -Pizlek.android=false

  engine:
    name: engine (rust) + end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (engine/rust-toolchain.toml)
        working-directory: engine
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - working-directory: engine
        run: cargo fmt --all -- --check
      - working-directory: engine
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit, integration, isolation and differential tests
        working-directory: engine
        run: cargo test --workspace
      - working-directory: engine
        run: cargo build -p la-shipper -p la-query

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the web SDK and the UI
        run: |
          (cd sdk-web && npm ci && npm run build)
          (cd ui && npm ci && npm run build)
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: End-to-end (file:// store)
        run: node e2e/run.mjs
        env:
          LA_E2E_GRADLE_ARGS: "-Pizlek.android=false"
      - name: End-to-end (S3 protocol)
        run: node e2e/run.mjs --s3
        env:
          LA_E2E_GRADLE_ARGS: "-Pizlek.android=false"
      - name: Start MinIO
        run: |
          docker pull -q "$MINIO_IMAGE" || { docker pull -q minio/minio:latest && docker tag minio/minio:latest "$MINIO_IMAGE"; }
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER="$MINIO_USER" -e MINIO_ROOT_PASSWORD="$MINIO_PASSWORD" "$MINIO_IMAGE" server /data
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:9000/minio/health/live && break; sleep 1; done
          AWS_ACCESS_KEY_ID="$MINIO_USER" AWS_SECRET_ACCESS_KEY="$MINIO_PASSWORD" AWS_DEFAULT_REGION=us-east-1 \
            aws --endpoint-url http://127.0.0.1:9000 s3 mb s3://la-test
      - name: End-to-end (MinIO)
        run: node e2e/run.mjs --s3
        env:
          LA_E2E_GRADLE_ARGS: "-Pizlek.android=false"
          LA_E2E_S3_ENDPOINT: http://127.0.0.1:9000
          LA_E2E_S3_BUCKET: la-test
          LA_E2E_S3_ACCESS_KEY: izlek-ci
          LA_E2E_S3_SECRET_KEY: izlek-ci-secret-key
